name: Validate NCAAF repair

on:
  push:
    branches: [fix/context-market-depth]
    paths:
      - 'pipeline/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-repair.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Python safety tests
        run: |
          python -m tests.test_offline
          python -m unittest tests.test_accuracy tests.test_schedule tests.test_context tests.test_privacy
      - name: Browser and ledger tests
        run: |
          node tests/test_matchups.js
          node tests/test_simulator.js
          node tests/test_staking.mjs
          node tests/test_ledger.mjs
          node tests/test_sync.mjs
